<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サクヤぐるなび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
<div class="page-head"><h1>地図で見る</h1></div>
<div class="card" style="padding:12px"><div class="map" id="map" style="height:70vh"></div></div>
</div>
<script src="/js/common.js"></script>
<script>
(async () => {
  const me = await requireMe();
  renderHeader(me, [{ label: "店一覧", href: "/" }, { label: "地図で見る" }]);
  const [shops] = await Promise.all([api("/api/shops"), loadMaps()]);
  const map = makeMap($("map"), OFFICE, 16);
  const info = new google.maps.InfoWindow();
  shops.filter(s => s.lat && s.lng).forEach(s => {
    const m = new google.maps.Marker({ position: { lat: s.lat, lng: s.lng }, map, title: s.name });
    m.addListener("click", () => {
      info.setContent(`<div style="font-family:sans-serif;line-height:1.6">
        <a href="/shop?id=${s.id}" style="font-weight:700">${esc(s.name)}</a><br>
        ${s.category ? esc(s.category) + " / " : ""}徒歩${s.walk_min || "?"}分<br>
        ${Number(s.review_count) ? stars(s.avg_rating) + " " + s.avg_rating : "評価なし"}</div>`);
      info.open(map, m);
    });
  });
})();
</script>
</body>
</html>
