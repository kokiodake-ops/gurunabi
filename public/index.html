<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サクヤぐるなび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf9f6;--card:#fff;--ink:#1e1b18;--sub:#8b8478;--line:#e9e4dc;--accent:#c0552f;--gold:#d9a441;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;line-height:1.8;letter-spacing:.02em;font-size:15px;}
.wrap{max-width:760px;margin:0 auto;padding:44px 20px 80px;}
h1{font-size:28px;margin:0 0 4px;font-weight:700;}
.lead{color:var(--sub);font-size:14px;margin:0;}
.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;}
.who{font-size:14px;color:var(--sub);text-align:right;white-space:nowrap;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px;margin-bottom:24px;}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;}
.field{margin-bottom:18px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
textarea{resize:vertical;min-height:70px;}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px 26px;font-size:15px;font-family:inherit;cursor:pointer;}
button:hover{opacity:.85;}
.link{background:none;color:var(--sub);padding:4px 8px;font-size:13px;text-decoration:underline;}
.link:hover{color:var(--accent);}
.tabs{display:flex;gap:18px;margin-bottom:22px;}
.tabs button{background:none;color:var(--sub);padding:4px 0;border-bottom:2px solid transparent;border-radius:0;font-size:15px;}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:700;}
.err{color:#c0392b;font-size:14px;margin-bottom:12px;}
.check{display:flex;gap:22px;margin-bottom:18px;}
.check label{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--ink);margin:0;cursor:pointer;}
.check input{width:auto;}
#pickMap,#viewMap{width:100%;height:260px;border-radius:8px;border:1px solid var(--line);}
#viewMap{width:100%;height:420px;border-radius:8px;border:1px solid var(--line);}
#editMap{width:100%;height:260px;border-radius:8px;border:1px solid var(--line);}
.hint{font-size:12px;color:var(--sub);margin-top:6px;}
.filter{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.filter button,.filter select{background:#fff;color:var(--sub);border:1px solid var(--line);padding:8px 18px;font-size:14px;width:auto;}
.filter button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.count{font-size:13px;color:var(--sub);margin-bottom:12px;}
ul{list-style:none;padding:0;margin:0;}
li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:12px;}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.name{font-size:17px;font-weight:700;}
.meta{font-size:13px;color:var(--sub);margin-top:2px;}
.tag{display:inline-block;background:#f4efe8;color:var(--sub);border-radius:4px;padding:2px 9px;font-size:12px;margin-right:6px;}
.tag.dining{background:#f3ece1;color:#8a6d3b;}
.stars{color:var(--gold);font-size:15px;letter-spacing:1px;}
.row>div:first-child{flex:1;min-width:0;}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0;}
.acts button{white-space:nowrap;}
.icon{background:none;color:var(--sub);padding:6px 12px;font-size:14px;border:1px solid var(--line);border-radius:6px;}
.icon.on{color:var(--accent);border-color:var(--accent);}
.icon:hover{border-color:var(--accent);}
.del{background:none;color:var(--sub);padding:6px 10px;font-size:13px;}
.del:hover{color:#c0392b;}
.detail{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
.review{font-size:14px;padding:10px 0;border-bottom:1px dashed var(--line);}
.review:last-child{border:0;}
.empty{text-align:center;color:var(--sub);padding:56px 0;font-size:15px;border:1px dashed var(--line);border-radius:12px;}
.hide{display:none;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:#fff;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:14px;}
.chip:hover{opacity:1;border-color:var(--accent);}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.attrs{background:#faf7f2;border-radius:10px;padding:16px 18px 2px;margin-bottom:18px;}
.attrs:empty{display:none;}
.tag.dinner{background:#e8eef3;color:#4a6378;}
.tag.drinks{background:#f3e6ea;color:#8a3b52;}
.attr{display:inline-block;border:1px solid var(--line);color:var(--sub);border-radius:4px;padding:0 8px;font-size:12px;margin:4px 6px 0 0;}
@media(max-width:560px){
  .wrap{padding:24px 14px 60px;}
  h1{font-size:22px;}
  .head{margin-bottom:18px;}
  .card{padding:18px;}
  .grid{display:block;}
  /* 絞り込みボタンは折り返さず横スクロール */
  .filter{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px 14px;padding:0 14px 4px;}
  .filter button,.filter select{flex-shrink:0;padding:8px 14px;}
  /* 店カード：情報を上、ボタンを下に */
  li{padding:16px;}
  .row{flex-direction:column;gap:12px;}
  .acts{width:100%;justify-content:flex-start;}
  .icon{padding:6px 12px;}
  #viewMap{height:320px;}
}
</style>
</head>
<body>
<div class="wrap">

<div class="head">
  <div>
    <h1>サクヤぐるなび</h1>
    <p class="lead">プライムプラザ周辺の飯屋ナレッジを貯めよう</p>
  </div>
  <div class="who" id="who"></div>
</div>

<div class="card hide" id="authCard">
  <div class="tabs">
    <button id="tabLogin" class="on" onclick="setMode('login')">ログイン</button>
    <button id="tabRegister" onclick="setMode('register')">新規登録</button>
  </div>
  <div class="err hide" id="authErr"></div>
  <div class="field"><label>名前</label><input id="authName" placeholder="大嶽"></div>
  <div class="field"><label>パスワード</label><input id="authPass" type="password" placeholder="8文字以上"></div>
  <button onclick="submitAuth()" id="authBtn">ログイン</button>
</div>

<div class="card hide" id="formCard">
  <div class="field"><label>店名</label><input id="name" placeholder="例：日高屋 渋谷店"></div>
  <div id="addForm"></div>
  <div class="grid">
    <div class="field"><label>ジャンル</label><input id="category" placeholder="ラーメン、和食など"></div>
    <div class="field"><label>価格帯</label>
      <select id="price_range">
        <option value="">選択</option>
        <option>〜500円</option><option>500〜800円</option><option>800〜1200円</option>
        <option>1200〜2000円</option><option>2000〜5000円</option><option>5000円〜</option>
      </select>
    </div>
  </div>
  <div class="field"><label>住所・場所</label><input id="address" placeholder="ビル名や目印でも可"></div>
  <div class="field">
    <label>場所を地図で指定</label>
    <div id="pickMap"></div>
    <div class="hint" id="pickHint">地図をクリックしてピンを置いてください（徒歩時間が自動計算されます）</div>
  </div>
  <button onclick="add()">登録する</button>
</div>
<div class="card hide" id="editCard">
  <div class="field"><label>店名</label><input id="e_name"></div>
  <div id="editForm"></div>
  <div class="grid">
    <div class="field"><label>ジャンル</label><input id="e_category"></div>
    <div class="field"><label>価格帯</label>
      <select id="e_price_range">
        <option value="">選択</option>
        <option>〜500円</option><option>500〜800円</option><option>800〜1200円</option>
        <option>1200〜2000円</option><option>2000〜5000円</option><option>5000円〜</option>
      </select>
    </div>
  </div>
  <div class="field"><label>住所・場所</label><input id="e_address"></div>
  <div class="field">
    <label>場所を地図で指定</label>
    <div id="editMap"></div>
    <div class="hint" id="editHint"></div>
  </div>
  <button onclick="saveEdit()">保存する</button>
  <button class="link" onclick="cancelEdit()">キャンセル</button>
</div>

<div class="filter hide" id="filter">
  <button id="fAll" class="on" onclick="setPurpose('')">すべて</button>
  <button id="fLunch" onclick="setPurpose('lunch')">昼飯</button>
  <button id="fDinner" onclick="setPurpose('dinner')">晩飯</button>
  <button id="fDining" onclick="setPurpose('dining')">会食</button>
  <button id="fDrinks" onclick="setPurpose('drinks')">飲み屋</button>
  <select id="walkSel" onchange="load()">
    <option value="">徒歩時間</option>
    <option value="3">3分以内</option>
    <option value="5">5分以内</option>
    <option value="10">10分以内</option>
    <option value="15">15分以内</option>
  </select>
  <button id="mapToggle" onclick="toggleMap()">地図で見る</button>
</div>

<input id="q" class="hide" placeholder="店名・ジャンルで検索" oninput="load()" style="margin-bottom:16px">

<div id="viewMapBox" class="card hide"><div id="viewMap"></div></div>

<div class="count" id="count"></div>
<ul id="list"></ul>
</div>

<script>
const OFFICE = { lat: 35.656555248889305, lng: 139.6951968036949 };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stars = n => "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n));

// ---- 区分と詳細項目（選択肢は server.js の OPTIONS と揃えること） ----
const PURPOSES = [
  { key:"for_lunch",  label:"昼飯",   cls:"" },
  { key:"for_dinner", label:"晩飯",   cls:"dinner" },
  { key:"for_dining", label:"会食",   cls:"dining" },
  { key:"for_drinks", label:"飲み屋", cls:"drinks" },
];
const MEAL = ["for_lunch","for_dinner"];
const ATTRS = [
  { key:"invoice",     label:"インボイス領収書", type:"bool",  opts:["可","不可"],     show:["for_dining"] },
  { key:"group_sizes", label:"推奨人数",   type:"multi", opts:["1人","2〜4人","5〜10人","11人以上"], show:[...MEAL,"for_drinks"] },
  { key:"smoking",     label:"喫煙",       type:"one",   opts:["禁煙","電子のみ可","紙も可"],     show:["for_drinks"] },
  { key:"nomihodai",   label:"飲み放題",   type:"bool",  opts:["あり","なし"],    show:["for_drinks"] },
  { key:"drink_price", label:"1杯あたりの値段（円）", type:"num", show:["for_drinks"] },
  { key:"garlic",      label:"にんにく",   type:"bool",  opts:["あり","なし"],    show:MEAL },
  { key:"health",      label:"健康度合い", type:"one",   opts:["ヘルシー","普通","ガッツリ"],     show:MEAL },
  { key:"speed",       label:"提供スピード", type:"one", opts:["すぐ出る","普通","時間かかる"],   show:MEAL },
  { key:"payments",    label:"決済手段",   type:"multi", opts:["現金","PayPay","クレカ"],        show:null },
];

// フォームの中身（区分ボタン＋詳細項目）を組み立てる
function buildForm(root){
  const chip = (v, text) => `<button class="chip" data-v="${esc(v)}">${esc(text)}</button>`;
  let html = `<div class="field"><label>区分（複数選択可）</label>
    <div class="chips" data-t="purpose">${PURPOSES.map(p=>chip(p.key,p.label)).join("")}</div></div>
    <div class="attrs">`;
  ATTRS.forEach(a=>{
    let body;
    if(a.type==="num") body = `<input type="number" min="0" data-num="${a.key}" placeholder="500" style="max-width:200px">`;
    else if(a.type==="bool") body = `<div class="chips" data-t="bool" data-k="${a.key}">${chip("true",a.opts[0])}${chip("false",a.opts[1])}</div>`;
    else body = `<div class="chips" data-t="${a.type}" data-k="${a.key}">${a.opts.map(o=>chip(o,o)).join("")}</div>`;
    html += `<div class="field" data-show="${a.show?a.show.join(","):""}"><label>${esc(a.label)}${a.type==="multi"?"（複数選択可）":""}</label>${body}</div>`;
  });
  root.innerHTML = html + `</div>`;
  root.addEventListener("click", e=>{
    const c = e.target.closest(".chip");
    if(!c) return;
    const g = c.parentElement, t = g.dataset.t;
    if(t==="purpose" || t==="multi"){
      c.classList.toggle("on");
    }else{
      const wasOn = c.classList.contains("on");
      g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
      if(!wasOn) c.classList.add("on");   // もう一度押すと解除
    }
    if(t==="purpose") updateVisibility(root);
  });
}

// 選ばれている区分に応じて、関係する項目だけ表示する
function updateVisibility(root){
  const active = [...root.querySelectorAll('[data-t="purpose"] .chip.on')].map(c=>c.dataset.v);
  root.querySelectorAll(".field[data-show]").forEach(f=>{
    const need = f.dataset.show;
    f.classList.toggle("hide", !!need && !need.split(",").some(k=>active.includes(k)));
  });
}

// フォームの値を読む
function readForm(root){
  const out = {};
  root.querySelectorAll(".chips").forEach(g=>{
    const on = [...g.querySelectorAll(".chip.on")].map(c=>c.dataset.v);
    const t = g.dataset.t, k = g.dataset.k;
    if(t==="purpose") PURPOSES.forEach(p=>out[p.key]=on.includes(p.key));
    else if(t==="multi") out[k] = on;
    else if(t==="bool") out[k] = on.length ? on[0]==="true" : null;
    else out[k] = on[0] || null;
  });
  root.querySelectorAll("[data-num]").forEach(i=>out[i.dataset.num] = i.value ? Number(i.value) : null);
  return out;
}

// 店のデータをフォームに反映する（s が空なら初期状態）
function fillForm(root, s){
  root.querySelectorAll(".chips").forEach(g=>{
    const t = g.dataset.t, k = g.dataset.k;
    g.querySelectorAll(".chip").forEach(c=>{
      const v = c.dataset.v;
      let on;
      if(t==="purpose") on = !!s[v];
      else if(t==="multi") on = (s[k]||[]).includes(v);
      else if(t==="bool") on = s[k]!=null && String(s[k])===v;
      else on = s[k]===v;
      c.classList.toggle("on", on);
    });
  });
  root.querySelectorAll("[data-num]").forEach(i=>i.value = s[i.dataset.num] ?? "");
  updateVisibility(root);
}

// 一覧カードに出す詳細タグ
function attrTags(s){
  const t = [];
  if(s.invoice!=null) t.push("インボイス"+(s.invoice?"可":"不可"));
  if(s.group_sizes?.length) t.push("推奨 "+s.group_sizes.join("・"));
  if(s.smoking) t.push(s.smoking==="禁煙"?"禁煙":"喫煙 "+s.smoking);
  if(s.nomihodai!=null) t.push("飲み放題"+(s.nomihodai?"あり":"なし"));
  if(s.drink_price) t.push("1杯 "+s.drink_price+"円");
  if(s.garlic!=null) t.push("にんにく"+(s.garlic?"あり":"なし"));
  if(s.health) t.push(s.health);
  if(s.speed) t.push("提供 "+s.speed);
  if(s.payments?.length) t.push(s.payments.join("・"));
  return t.length ? '<div>'+t.map(x=>'<span class="attr">'+esc(x)+'</span>').join("")+'</div>' : "";
}

let me=null, mode="login", purpose="", openId=null, shopsCache=[];
let pickMap=null, pickMarker=null, picked=null, viewMap=null, viewMarkers=[], mapOn=false;
let editMap=null, editMarker=null, editPicked=null, editingId=null;

function initMaps(){
  pickMap = new google.maps.Map($("pickMap"), { center: OFFICE, zoom: 16, mapTypeControl:false, streetViewControl:false });
  new google.maps.Marker({ position: OFFICE, map: pickMap, label: "社", title: "オフィス" });
  pickMap.addListener("click", e => {
    picked = { lat: e.latLng.lat(), lng: e.latLng.lng() };
    if(pickMarker) pickMarker.setMap(null);
    pickMarker = new google.maps.Marker({ position: e.latLng, map: pickMap });
    $("pickHint").textContent = "ピンを置きました（クリックし直すと変更できます）";
  });
    editMap = new google.maps.Map($("editMap"), { center: OFFICE, zoom: 16, mapTypeControl:false, streetViewControl:false });
  new google.maps.Marker({ position: OFFICE, map: editMap, label: "社", title: "オフィス" });
  editMap.addListener("click", e => {
    editPicked = { lat: e.latLng.lat(), lng: e.latLng.lng() };
    if(editMarker) editMarker.setMap(null);
    editMarker = new google.maps.Marker({ position: e.latLng, map: editMap });
    $("editHint").textContent = "位置を変更しました";
  });
  viewMap = new google.maps.Map($("viewMap"), { center: OFFICE, zoom: 16, mapTypeControl:false, streetViewControl:false });
  new google.maps.Marker({ position: OFFICE, map: viewMap, label: "社", title: "オフィス" });
}

function showOnMap(id){
  const s = shopsCache.find(x => x.id === id);
  if(!s) return;
  if(!s.lat || !s.lng){
    alert("この店には位置が登録されていません");
    return;
  }
  if(!mapOn){
    mapOn = true;
    $("viewMapBox").className = "card";
    $("mapToggle").className = "on";
    google.maps.event.trigger(viewMap, "resize");
    drawMarkers();
  }
  viewMap.setCenter({ lat: s.lat, lng: s.lng });
  viewMap.setZoom(18);
  $("viewMapBox").scrollIntoView({ behavior: "smooth", block: "center" });
  const m = viewMarkers.find(mk => mk.getTitle() === s.name);
  if(m){
    m.setAnimation(google.maps.Animation.BOUNCE);
    setTimeout(() => m.setAnimation(null), 2000);
    google.maps.event.trigger(m, "click");
  }
}

function drawMarkers(){
  viewMarkers.forEach(m => m.setMap(null));
  viewMarkers = [];
  const info = new google.maps.InfoWindow();
  shopsCache.filter(s => s.lat && s.lng).forEach(s => {
    const m = new google.maps.Marker({ position:{lat:s.lat,lng:s.lng}, map:viewMap, title:s.name });
    m.addListener("click", () => {
      info.setContent(`<div style="font-family:sans-serif"><b>${esc(s.name)}</b><br>
        ${s.category?esc(s.category)+" / ":""}徒歩${s.walk_min||"?"}分<br>
        ${Number(s.review_count)?stars(s.avg_rating)+" "+s.avg_rating:"評価なし"}</div>`);
      info.open(viewMap, m);
    });
    viewMarkers.push(m);
  });
}
function startEdit(id){
  const s = shopsCache.find(x => x.id === id);
  if(!s) return;
  editingId = id;
  editPicked = null;
  $("e_name").value = s.name || "";
  $("e_category").value = s.category || "";
  $("e_address").value = s.address || "";
  $("e_price_range").value = s.price_range || "";
  fillForm($("editForm"), s);

  $("formCard").className = "card hide";
  $("editCard").className = "card";
  google.maps.event.trigger(editMap, "resize");

  if(editMarker){ editMarker.setMap(null); editMarker = null; }
  if(s.lat && s.lng){
    const pos = { lat: s.lat, lng: s.lng };
    editMarker = new google.maps.Marker({ position: pos, map: editMap });
    editMap.setCenter(pos);
    editMap.setZoom(17);
    $("editHint").textContent = "現在の位置です。変えたい場合は地図をクリックしてください";
  }else{
    editMap.setCenter(OFFICE);
    editMap.setZoom(16);
    $("editHint").textContent = "位置が未登録です。地図をクリックしてピンを置いてください";
  }
  $("editCard").scrollIntoView({ behavior:"smooth", block:"center" });
}

function cancelEdit(){
  editingId = null;
  editPicked = null;
  if(editMarker){ editMarker.setMap(null); editMarker = null; }
  $("editCard").className = "card hide";
  $("formCard").className = "card";
}

async function saveEdit(){
  if(!$("e_name").value.trim()) return;
  const cur = shopsCache.find(x => x.id === editingId) || {};
  const res = await fetch("/api/shops/"+editingId, {
    method:"PUT", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      name:$("e_name").value, category:$("e_category").value,
      price_range:$("e_price_range").value, address:$("e_address").value,
      ...readForm($("editForm")),
      lat: editPicked ? editPicked.lat : cur.lat,
      lng: editPicked ? editPicked.lng : cur.lng
    })
  });
  if(!res.ok){ alert((await res.json()).error); return; }
  cancelEdit();
  load();
}
function setMode(m){
  mode=m;
  $("tabLogin").className = m==="login"?"on":"";
  $("tabRegister").className = m==="register"?"on":"";
  $("authBtn").textContent = m==="login"?"ログイン":"登録する";
  $("authErr").className="err hide";
}

function setPurpose(p){
  purpose=p;
  $("fAll").className = p===""?"on":"";
  $("fLunch").className = p==="lunch"?"on":"";
  $("fDinner").className = p==="dinner"?"on":"";
  $("fDining").className = p==="dining"?"on":"";
  $("fDrinks").className = p==="drinks"?"on":"";
  load();
}

async function submitAuth(){
  const res = await fetch("/api/"+(mode==="login"?"login":"register"),{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:$("authName").value,password:$("authPass").value})
  });
  const data = await res.json();
  if(!res.ok){ $("authErr").textContent=data.error; $("authErr").className="err"; return; }
  $("authPass").value="";
  await checkMe(); load();
}

async function logout(){ await fetch("/api/logout",{method:"POST"}); openId=null; await checkMe(); load(); }

async function checkMe(){
  me = await (await fetch("/api/me")).json();
  if(me){
    $("who").innerHTML = esc(me.name)+' <button class="link" onclick="logout()">ログアウト</button>';
    $("authCard").className="card hide"; $("formCard").className="card";
    $("filter").className="filter"; $("q").className="";
    if(pickMap) google.maps.event.trigger(pickMap,"resize");
  }else{
    $("who").textContent="";
    $("authCard").className="card"; $("formCard").className="card hide";
    $("filter").className="filter hide"; $("q").className="hide";
    $("viewMapBox").className="card hide"; mapOn=false;
  }
}

async function add(){
  if(!$("name").value.trim()) return;
  const res = await fetch("/api/shops",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      name:$("name").value, category:$("category").value,
      price_range:$("price_range").value, address:$("address").value,
      ...readForm($("addForm")),
      lat:picked?picked.lat:null, lng:picked?picked.lng:null
    })
  });
  if(!res.ok){ alert((await res.json()).error); return; }
  ["name","category","address"].forEach(id=>$(id).value="");
  $("price_range").value="";
  fillForm($("addForm"), { for_lunch:true });
  if(pickMarker){ pickMarker.setMap(null); pickMarker=null; }
  picked=null;
  $("pickHint").textContent="地図をクリックしてピンを置いてください（徒歩時間が自動計算されます）";
  load();
}

async function remove(id){
  if(!confirm("削除しますか？")) return;
  const res = await fetch("/api/shops/"+id,{method:"DELETE"});
  if(!res.ok){ alert((await res.json()).error); return; }
  load();
}

async function toggleFav(id){
  const res = await fetch("/api/shops/"+id+"/favorite",{method:"POST"});
  if(!res.ok){ alert((await res.json()).error); return; }
  load();
}

function toggleDetail(id){ openId = openId===id?null:id; load(); }

async function postReview(id){
  const res = await fetch("/api/shops/"+id+"/reviews",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({rating:Number($("rt"+id).value),comment:$("cm"+id).value,paid_price:$("pp"+id).value||null})
  });
  if(!res.ok){ alert((await res.json()).error); return; }
  load();
}

async function load(){
  if(!me){ $("count").textContent=""; $("list").innerHTML=""; return; }
  const walk = $("walkSel") ? $("walkSel").value : "";
  const res = await fetch("/api/shops?q="+encodeURIComponent($("q").value)+"&purpose="+purpose+"&walk="+walk);
  if(!res.ok){ await checkMe(); return; }
  shopsCache = await res.json();
  if(mapOn) drawMarkers();

  $("count").textContent = shopsCache.length ? shopsCache.length+" 件" : "";
  if(!shopsCache.length){ $("list").innerHTML='<div class="empty">条件に合う店がありません</div>'; return; }

  $("list").innerHTML = shopsCache.map(s=>`
    <li>
      <div class="row">
        <div>
          <div class="name">${esc(s.name)}</div>
          <div class="meta">
            ${PURPOSES.filter(p=>s[p.key]).map(p=>'<span class="tag '+p.cls+'">'+p.label+'</span>').join("")}
            ${s.category?'<span class="tag">'+esc(s.category)+'</span>':''}
            ${s.walk_min?"徒歩"+esc(s.walk_min)+"分":""}
            ${s.price_range?" / "+esc(s.price_range):""}
          </div>
          <div class="meta">
            ${Number(s.review_count)?'<span class="stars">'+stars(s.avg_rating)+'</span> '+s.avg_rating+'（'+s.review_count+'件）':'<span style="color:#bbb">評価なし</span>'}
            ${s.avg_price?" / 平均 "+s.avg_price+"円":""}
          </div>
          ${attrTags(s)}
          ${s.address?'<div class="meta">'+esc(s.address)+'</div>':''}
          ${Number(s.fav_count)?'<div class="meta">♥ '+esc(s.fav_users)+'</div>':''}
        </div>
        <div class="acts">
          <button class="icon ${s.faved_by_me?'on':''}" onclick="toggleFav(${s.id})">♥ ${s.fav_count}</button>
          ${s.lat && s.lng ? `<button class="icon" onclick="showOnMap(${s.id})">地図</button>` : ""}
          <button class="icon" onclick="toggleDetail(${s.id})">口コミ</button>
          <button class="icon" onclick="startEdit(${s.id})">編集</button>
          ${me.name===s.created_by_name?`<button class="del" onclick="remove(${s.id})">削除</button>`:""}
        </div>
      </div>
      <div class="detail ${openId===s.id?'':'hide'}" id="d${s.id}"></div>
    </li>
  `).join("");

  if(openId) loadReviews(openId);
}

async function loadReviews(id){
  const box = $("d"+id);
  if(!box) return;
  const res = await fetch("/api/shops/"+id+"/reviews");
  if(!res.ok) return;
  const reviews = await res.json();
  box.innerHTML = `
    <div class="grid" style="margin-bottom:10px">
      <div class="field" style="margin:0"><label>評価</label>
        <select id="rt${id}"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select>
      </div>
      <div class="field" style="margin:0"><label>払った金額</label><input id="pp${id}" type="number" placeholder="900"></div>
    </div>
    <div class="field"><textarea id="cm${id}" placeholder="何がおいしい、混み具合、何時なら入れるなど"></textarea></div>
    <button onclick="postReview(${id})">口コミを書く</button>
  ` + (reviews.length ? reviews.map(r=>`
      <div class="review">
        <span class="stars">${stars(r.rating)}</span>
        <strong>${esc(r.user_name)}</strong>
        ${r.paid_price?'<span class="meta">'+r.paid_price+'円</span>':''}
        <div>${esc(r.comment||"")}</div>
      </div>`).join("") : '<div class="meta" style="margin-top:10px">まだ口コミがありません</div>');
}

function boot(){
  buildForm($("addForm")); buildForm($("editForm"));
  fillForm($("addForm"), { for_lunch:true });
  initMaps(); checkMe().then(load); }
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBqTEJ15xCXIJMGG5iRyfTJ9mWnmf79Xik&callback=boot"></script>
</body>
</html>
